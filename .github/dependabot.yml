version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Dev dependencies: coding standards.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      coding-standards:
        patterns: ['*']
